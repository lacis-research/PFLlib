name: pfllib
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy<2
  - pip=22
  - pandas
  - scikit-learn
  - scipy
  - ujson
  - h5py
  - seaborn
  - matplotlib
  - click
  - pip:  # manually install with mirror URLs if a timeout occurs
    - numpy<2  # keep pip dependencies compatible with torch 2.0.1
    - torch==2.0.1
    - torchaudio
    - torchtext
    - torchvision
    - calmsize
    - memory-profiler
    - portalocker
    - cvxpy==1.6.5  # supports NumPy 1.x alongside torch 2.0.1
    - higher
    - diffusers
    - accelerate
    - transformers
